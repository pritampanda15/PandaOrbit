<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PandaOrbit</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip-link" href="#app-main">Skip to content</a>

<header id="topbar" role="banner">
  <button type="button" class="brand" id="brand-home" aria-label="PandaOrbit, go to Dashboard">
    <svg class="brand-mark" viewBox="0 0 36 36" width="28" height="28" aria-hidden="true">
      <circle cx="18" cy="18" r="16" fill="#060c18" stroke="var(--apple-color-tint)" stroke-opacity="0.55" stroke-width="1.3"/>
      <circle cx="18" cy="18" r="12.5" fill="none" stroke="var(--apple-color-tint)" stroke-opacity="0.32" stroke-width="1" stroke-dasharray="6 4"/>
      <circle cx="29.2" cy="9.4" r="2.2" fill="#FF9F0A"/>
      <circle cx="12.5" cy="12" r="3.2" fill="#0f172a" stroke="#38d9ff" stroke-width="1"/>
      <circle cx="23.5" cy="12" r="3.2" fill="#0f172a" stroke="#38d9ff" stroke-width="1"/>
      <ellipse cx="18" cy="19.2" rx="7.6" ry="6.8" fill="#F5F5F7"/>
      <ellipse cx="15.1" cy="18.6" rx="2.0" ry="2.5" transform="rotate(-15 15.1 18.6)" fill="#0b1324"/>
      <ellipse cx="20.9" cy="18.6" rx="2.0" ry="2.5" transform="rotate(15 20.9 18.6)" fill="#0b1324"/>
      <circle cx="15.4" cy="18.2" r="0.85" fill="#38d9ff"/>
      <circle cx="20.6" cy="18.2" r="0.85" fill="#38d9ff"/>
      <ellipse cx="18" cy="21.2" rx="1.4" ry="1.0" fill="#0b1324"/>
    </svg>
    <span class="brand-text">
      <span class="brand-name">PandaOrbit</span>
      <span class="brand-sub" id="title">Workspace</span>
    </span>
  </button>

  <nav class="segmented-nav" role="tablist" aria-label="Workspace views">
    <button type="button" class="seg-tab" id="tab-dashboard" data-view="dashboard" role="tab" aria-selected="true" aria-controls="view-dashboard">
      <svg class="ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.75" y="2.75" width="6" height="6" rx="1.5"/>
        <rect x="11.25" y="2.75" width="6" height="6" rx="1.5"/>
        <rect x="2.75" y="11.25" width="6" height="6" rx="1.5"/>
        <rect x="11.25" y="11.25" width="6" height="6" rx="1.5"/>
      </svg>
      <span>Dashboard</span>
    </button>
    <button type="button" class="seg-tab" id="tab-orbit" data-view="orbit" role="tab" aria-selected="false" aria-controls="view-orbit">
      <svg class="ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65">
        <circle cx="10" cy="10" r="2.2" fill="currentColor" stroke="none"/>
        <circle cx="10" cy="10" r="6.75"/>
        <circle cx="15.2" cy="5.8" r="1.45" fill="currentColor" stroke="none"/>
      </svg>
      <span>Orbit HUD</span>
    </button>
    <button type="button" class="seg-tab" id="tab-habits" data-view="habits" role="tab" aria-selected="false" aria-controls="view-habits">
      <svg class="ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="10" r="7.25"/>
        <path d="M10 5.75V10l2.75 1.75"/>
      </svg>
      <span>Habits</span>
    </button>
    <button type="button" class="seg-tab" id="tab-storage" data-view="storage" role="tab" aria-selected="false" aria-controls="view-storage">
      <svg class="ic" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.75" y="4.25" width="14.5" height="11.5" rx="2.5"/>
        <path d="M2.75 11.5h14.5"/>
        <circle cx="13.75" cy="13.75" r="0.85" fill="currentColor" stroke="none"/>
      </svg>
      <span>Storage</span>
    </button>
  </nav>

  <div class="top-actions" role="toolbar" aria-label="Workspace actions">
    <button type="button" id="sprint-pill" class="btn btn-tinted btn-compact sprint-pill" hidden title="Active focus sprint — click to complete or cancel">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="sprint-pill-label">25:00</span>
    </button>
    <button type="button" id="cmdk-btn" class="btn btn-tinted btn-compact" aria-label="Open command palette" title="Quick search & commands (⌘K)">
      <span>Search</span>
      <kbd class="kbd-hint">⌘K</kbd>
    </button>
    <button type="button" id="tracker-pill" class="btn btn-tinted btn-compact" aria-pressed="false" title="Toggle live foreground activity tracker">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="tracker-pill-label">Tracker Off</span>
    </button>
    <button type="button" id="rescan-btn" class="btn btn-plain btn-icon" aria-label="Rescan project folders" title="Rescan folders and git history">
      <svg class="ic" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16.25 10a6.25 6.25 0 1 1-1.6-4.18"/>
        <path d="M16.25 3.75v2.75H13.5"/>
      </svg>
    </button>
    <button type="button" id="theme-btn" class="btn btn-plain btn-icon" aria-label="Switch appearance" title="Switch Light / Dark appearance">
      <svg class="ic" id="theme-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="10" r="3.5"/>
        <path d="M10 2.75v1.5M10 15.75v1.5M2.75 10h1.5M15.75 10h1.5M4.87 4.87l1.06 1.06M14.07 14.07l1.06 1.06M15.13 4.87l-1.06 1.06M5.93 14.07l-1.06 1.06"/>
      </svg>
    </button>
  </div>
</header>

<main id="app-main" tabindex="-1">
  <!-- View 1: Unified Dashboard -->
  <section id="view-dashboard" class="view-pane" role="tabpanel" aria-labelledby="tab-dashboard"></section>

  <!-- View 2: J.A.R.V.I.S. / God's-Eye-View Holographic Orbit HUD -->
  <section id="view-orbit" class="view-pane view-orbit" data-optical="jarvis" role="tabpanel" aria-labelledby="tab-orbit">
    <div id="stage">
      <svg id="svg" role="img" aria-label="Holographic tactical map of workspace projects and domains"></svg>
    </div>

    <!-- Subtle optical scanline & vignette layer -->
    <div id="hud-optical-fx" aria-hidden="true"></div>

    <!-- Top-Left God's-Eye Tactical Command Deck -->
    <div id="orbit-hud-top">
      <div class="hud-header-line">
        <span class="hud-badge">PANDA.ORBIT // GOD'S-EYE</span>
        <span class="hud-clock" id="hud-clock">00:00:00</span>
      </div>
      <div id="orbit-controls" role="toolbar" aria-label="Orbit HUD controls">
        <div class="hud-mode-group" role="group" aria-label="Optical mode">
          <button type="button" class="hud-mode-btn active" data-optical-btn="jarvis" aria-pressed="true">JARVIS</button>
          <button type="button" class="hud-mode-btn" data-optical-btn="nvg" aria-pressed="false">NVG</button>
          <button type="button" class="hud-mode-btn" data-optical-btn="flir" aria-pressed="false">FLIR</button>
          <button type="button" class="hud-mode-btn" data-optical-btn="crt" aria-pressed="false">CRT</button>
        </div>
        <label class="sr-only" for="orbit-search">Lock target project in Orbit HUD</label>
        <input id="orbit-search" class="orbit-input" type="search" placeholder="Lock target…" autocomplete="off">
        <button type="button" id="orbit-pause" class="orbit-btn" aria-pressed="false" title="Pause or resume rotation (Space)">Pause</button>
        <button type="button" id="orbit-fit" class="orbit-btn" title="Fit constellation to viewport">Fit</button>
      </div>
    </div>

    <!-- Bottom-Left Live Signal Graph & Compact Telemetry Feed -->
    <div id="orbit-telemetry-dock" aria-label="Live habit telemetry dock">
      <div class="hud-dock-head">
        <span class="hud-dock-title">LIVE TELEMETRY STREAM</span>
        <div class="hud-dock-actions">
          <span class="hud-sig-pill" id="orbit-sig-pill">STANDBY</span>
          <button type="button" id="orbit-dock-toggle" class="hud-mini-btn" aria-expanded="true" title="Collapse or expand telemetry dock">Hide</button>
        </div>
      </div>
      <div id="orbit-dock-body">
        <canvas id="orbit-signal-canvas" class="hud-mini-canvas" aria-label="Live focus signal waveform"></canvas>
        <div id="orbit-term-feed" class="hud-mini-feed" aria-live="polite"></div>
      </div>
    </div>

    <!-- Holographic File Quick-Look Preview (shown when clicking a file inside an expanded branch) -->
    <div id="orbit-file-preview" role="dialog" aria-label="Holographic file preview" aria-hidden="true"></div>

    <!-- Floating Holographic Branch Action Bar (shown only when a node branch is expanded) -->
    <div id="orbit-branch-bar" role="region" aria-label="Expanded branch controls" aria-hidden="true"></div>

    <!-- Bottom-Right Tactical Telemetry Readouts -->
    <div id="orbit-readouts" aria-label="Orbital telemetry readout">
      <div class="ro-grid">
        <div class="ro-cell"><span class="ro-k">OPTICS</span><span class="ro-v" id="ro-mode">JARVIS</span></div>
        <div class="ro-cell"><span class="ro-k">AZIMUTH</span><span class="ro-v" id="ro-az">000.0°</span></div>
        <div class="ro-cell"><span class="ro-k">ZOOM</span><span class="ro-v" id="ro-zoom">100%</span></div>
        <div class="ro-cell"><span class="ro-k">ACTIVE</span><span class="ro-v" id="ro-active">0/0</span></div>
        <div class="ro-cell ro-wide"><span class="ro-k">TARGET LOCK</span><span class="ro-v" id="ro-target">SCANNING</span></div>
      </div>
      <div class="ro-hint">Click any node to expand its full holographic branch · Esc to collapse</div>
    </div>
  </section>

  <!-- View 3: Focus & Live Telemetry -->
  <section id="view-habits" class="view-pane" role="tabpanel" aria-labelledby="tab-habits"></section>

  <!-- View 4: System Storage & Heavy Files Analyzer -->
  <section id="view-storage" class="view-pane" role="tabpanel" aria-labelledby="tab-storage"></section>
</main>

<!-- Shared Floating Inspector -->
<aside id="panel" role="complementary" aria-label="Project inspector" aria-hidden="true"></aside>

<!-- Universal ⌘K Command Palette -->
<div id="cmdk-backdrop" aria-hidden="true">
  <div id="cmdk-dialog" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="cmdk-input-row">
      <label class="sr-only" for="cmdk-input">Search projects, views, and commands</label>
      <input id="cmdk-input" type="search" placeholder="Jump to project, expand branch, start focus sprint, switch optics…" autocomplete="off">
      <kbd class="kbd-hint">ESC</kbd>
    </div>
    <div id="cmdk-list" class="cmdk-list" role="listbox" aria-label="Matching commands"></div>
  </div>
</div>

<!-- Accessible Live Region Toast -->
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="data.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
