<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="PandaOrbit — Personal Workspace, Focus Telemetry, and Storage Command Center">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#0d1e38"/>
      <stop offset="55%" stop-color="#070e1c"/>
      <stop offset="100%" stop-color="#04070f"/>
    </radialGradient>
    <radialGradient id="core-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38d9ff" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#38d9ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38d9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38d9ff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#38d9ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38d9ff"/>
      <stop offset="55%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#ff9f0a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="900" height="420" rx="20" fill="url(#bg-glow)"/>
  <rect x="0.75" y="0.75" width="898.5" height="418.5" rx="19.25" fill="none" stroke="#38d9ff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Subtle Starfield & Telemetry Grid -->
  <g stroke="#38d9ff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="105" x2="900" y2="105"/>
    <line x1="0" y1="210" x2="900" y2="210"/>
    <line x1="0" y1="315" x2="900" y2="315"/>
    <line x1="225" y1="0" x2="225" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="675" y1="0" x2="675" y2="420"/>
  </g>
  <g fill="#7dd3fc" fill-opacity="0.35">
    <circle cx="88" cy="64" r="1.1"/><circle cx="164" cy="142" r="0.9"/><circle cx="118" cy="290" r="1.2"/>
    <circle cx="242" cy="82" r="0.8"/><circle cx="310" cy="346" r="1.1"/><circle cx="786" cy="74" r="1.2"/>
    <circle cx="828" cy="186" r="0.9"/><circle cx="742" cy="332" r="1.1"/><circle cx="640" cy="68" r="0.9"/>
    <circle cx="598" cy="364" r="0.8"/><circle cx="76" cy="362" r="1.0"/><circle cx="842" cy="356" r="1.0"/>
  </g>

  <!-- Corner HUD Brackets -->
  <g fill="none" stroke="#38d9ff" stroke-opacity="0.45" stroke-width="1.5">
    <path d="M 22 44 L 22 22 L 44 22"/>
    <path d="M 856 22 L 878 22 L 878 44"/>
    <path d="M 22 376 L 22 398 L 44 398"/>
    <path d="M 856 398 L 878 398 L 878 376"/>
  </g>

  <!-- Left Orbital Emblem -->
  <g transform="translate(245, 210)">
    <circle r="158" fill="url(#core-aura)"/>

    <!-- Radar Sweep -->
    <g>
      <path d="M 0,0 L 146,0 A 146,146 0 0 1 131,64 Z" fill="url(#sweep)"/>
      <line x1="0" y1="0" x2="146" y2="0" stroke="#38d9ff" stroke-opacity="0.65" stroke-width="1.2"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </g>

    <!-- Concentric Orbital Tracks -->
    <circle r="146" fill="none" stroke="#38d9ff" stroke-opacity="0.22" stroke-width="1"/>
    <circle r="114" fill="none" stroke="#38d9ff" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 6"/>
    <circle r="84" fill="none" stroke="#38d9ff" stroke-opacity="0.32" stroke-width="1.2"/>

    <!-- Counter-Rotating Holographic HUD Rings -->
    <g>
      <circle r="132" fill="none" stroke="#38d9ff" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="36 16 8 16"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="98" fill="none" stroke="#ff9f0a" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="22 24 6 14"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
    </g>

    <!-- Orbiting Project & Telemetry Nodes -->
    <g>
      <!-- Active Amber Satellite -->
      <line x1="0" y1="0" x2="114" y2="-66" stroke="#ff9f0a" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="114" cy="-66" r="11" fill="#ff9f0a" fill-opacity="0.18">
        <animate attributeName="r" values="9;15;9" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values="0.26;0.04;0.26" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="114" cy="-66" r="5.5" fill="#ff9f0a" filter="url(#glow)"/>
      <circle cx="114" cy="-66" r="2.2" fill="#ffffff"/>

      <!-- Cyan Satellite -->
      <line x1="0" y1="0" x2="-122" y2="-48" stroke="#38d9ff" stroke-opacity="0.4" stroke-width="1.1"/>
      <circle cx="-122" cy="-48" r="5" fill="#38d9ff" filter="url(#glow)"/>

      <!-- Green Live Tracker Satellite -->
      <line x1="0" y1="0" x2="-88" y2="108" stroke="#30d158" stroke-opacity="0.4" stroke-width="1.1"/>
      <circle cx="-88" cy="108" r="5" fill="#30d158" filter="url(#glow)"/>

      <!-- Indigo Storage Satellite -->
      <line x1="0" y1="0" x2="104" y2="96" stroke="#7d7aff" stroke-opacity="0.4" stroke-width="1.1"/>
      <circle cx="104" cy="96" r="4.8" fill="#7d7aff" filter="url(#glow)"/>

      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/>
    </g>

    <!-- Central Geometric Panda Emblem -->
    <circle r="60" fill="#060c18" stroke="#38d9ff" stroke-opacity="0.7" stroke-width="1.6" filter="url(#glow)"/>
    <circle r="52" fill="none" stroke="#38d9ff" stroke-opacity="0.25" stroke-width="1"/>
    <!-- Ears -->
    <circle cx="-21" cy="-21" r="11.5" fill="#0f172a" stroke="#38d9ff" stroke-width="1.6"/>
    <circle cx="21" cy="-21" r="11.5" fill="#0f172a" stroke="#38d9ff" stroke-width="1.6"/>
    <!-- Head -->
    <ellipse cx="0" cy="4" rx="28" ry="25" fill="#f5f5f7"/>
    <!-- Eye Patches -->
    <ellipse cx="-10.5" cy="2" rx="7.2" ry="9" transform="rotate(-16 -10.5 2)" fill="#0b1324"/>
    <ellipse cx="10.5" cy="2" rx="7.2" ry="9" transform="rotate(16 10.5 2)" fill="#0b1324"/>
    <!-- Cyan Glowing Eyes -->
    <circle cx="-9.2" cy="0.5" r="2.6" fill="#38d9ff" filter="url(#glow)"/>
    <circle cx="9.2" cy="0.5" r="2.6" fill="#38d9ff" filter="url(#glow)"/>
    <circle cx="-8.5" cy="-0.3" r="0.9" fill="#ffffff"/>
    <circle cx="9.9" cy="-0.3" r="0.9" fill="#ffffff"/>
    <!-- Nose & Subtle Smile -->
    <ellipse cx="0" cy="11.5" rx="4.5" ry="3.1" fill="#0b1324"/>
    <path d="M -5 16.5 Q 0 20.5 5 16.5" fill="none" stroke="#0b1324" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Right Brand Lockup -->
  <g transform="translate(445, 142)">
    <rect x="0" y="-26" width="218" height="24" rx="12" fill="#38d9ff" fill-opacity="0.11" stroke="#38d9ff" stroke-opacity="0.35"/>
    <circle cx="14" cy="-14" r="3.5" fill="#30d158">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="-10" fill="#7dd3fc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" letter-spacing="1.6">LOCAL WORKSPACE COMMAND</text>

    <text x="0" y="54" fill="#f5f5f7" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif" font-size="56" font-weight="700" letter-spacing="-1.2">Panda<tspan fill="url(#accent-grad)">Orbit</tspan></text>

    <text x="2" y="88" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif" font-size="16.5">Your repositories, focus telemetry, and storage — in one orbit.</text>

    <!-- 4 Feature Pills -->
    <g transform="translate(0, 114)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600">
      <rect x="0" y="0" width="98" height="28" rx="7" fill="#0d192e" stroke="#38d9ff" stroke-opacity="0.35"/>
      <text x="49" y="18" text-anchor="middle" fill="#e6f6ff">DASHBOARD</text>

      <rect x="108" y="0" width="98" height="28" rx="7" fill="#0d192e" stroke="#ff9f0a" stroke-opacity="0.45"/>
      <text x="157" y="18" text-anchor="middle" fill="#ffd085">ORBIT HUD</text>

      <rect x="216" y="0" width="94" height="28" rx="7" fill="#0d192e" stroke="#30d158" stroke-opacity="0.4"/>
      <text x="263" y="18" text-anchor="middle" fill="#a7f3d0">TELEMETRY</text>

      <rect x="320" y="0" width="92" height="28" rx="7" fill="#0d192e" stroke="#7d7aff" stroke-opacity="0.45"/>
      <text x="366" y="18" text-anchor="middle" fill="#c7d2fe">STORAGE</text>
    </g>

    <text x="2" y="178" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">Zero npm dependencies · Node 18+ · 100% Local &amp; Private</text>
  </g>
</svg>
